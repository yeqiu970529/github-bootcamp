<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f5f0">
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="todo-card" aria-labelledby="page-title">
        <header class="card-header">
          <div class="card-header-top">
            <div class="header-copy">
              <p class="eyebrow">把想做的事，一件件完成</p>
              <h1 id="page-title">待辦清單</h1>
              <p class="subtitle">記下此刻重要的小事。</p>
            </div>
            <button
              class="theme-toggle"
              id="theme-toggle"
              type="button"
              aria-label="切換深色模式"
              aria-pressed="false"
            >
              <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
              <span class="theme-toggle__label">深色模式</span>
            </button>
          </div>
        </header>

        <form class="todo-form" id="todo-form">
          <label class="visually-hidden" for="todo-input">新增待辦事項</label>
          <input
            id="todo-input"
            name="todo"
            type="text"
            placeholder="接下來要做什麼？"
            autocomplete="off"
            maxlength="200"
            required
          >
          <button class="add-button" type="submit">
            <span aria-hidden="true">＋</span>
            新增
          </button>
        </form>

        <div class="filter-group" role="group" aria-label="篩選待辦事項">
          <button class="filter-button is-active" data-filter="all" type="button">全部</button>
          <button class="filter-button" data-filter="active" type="button">未完成</button>
          <button class="filter-button" data-filter="completed" type="button">已完成</button>
        </div>

        <ul class="todo-list" id="todo-list" aria-label="待辦事項"></ul>

        <p class="empty-state" id="empty-state">還沒有任何待辦事項,新增一個吧!</p>

        <footer class="card-footer">
          <span id="remaining-count" aria-live="polite">未完成:0 項</span>
        </footer>
      </section>
      <p class="page-note">每一步都算數。</p>
    </main>
  </body>
</html>
